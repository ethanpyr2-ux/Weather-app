<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
  <title>Weather App</title>
</head>
<body>


  <div class="container">
    <div class="search-box">
      <i class="fa-solid fa-location-dot"></i>
      <input type ="text" class = search-bar placeholder = "Entrez le nom de votre ville">
      <button class = "search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="not-found">
      <img src="styles/images/not_Found.png" alt="Ville non trouvée" class="not-found-icon" style="width: 200px !important; height: auto;">
      <p>Désolé je n'ai pas pu trouvrer votre ville :/</p>
    </div>

    <div class="weather-box">

        <div class="city-name"></div>
        <i id ="weather-icon" class=""></i>
        <div class="temperature"></div>
        <div class="description"></div>
        <div class="humidity"><i class="fa-solid fa-droplet"></i></div>
        <div class="wind"><i class="fa-solid fa-wind"></i></div>

    </div>

  </div>
  <script src="https://kit.fontawesome.com/fd04468511.js" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
